<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>云南奶龙大学</title>
<meta name="description" content="正在跳转至云南财经大学 · 云南奶龙大学（非官方网站）">
<meta name="theme-color" content="#1a5aa0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='34' cy='26' rx='8' ry='19' fill='%23f0c040' transform='rotate(-14 34 26)'/%3E%3Cellipse cx='66' cy='26' rx='8' ry='19' fill='%23f0c040' transform='rotate(14 66 26)'/%3E%3Cellipse cx='50' cy='60' rx='31' ry='33' fill='%232f6fc4'/%3E%3Cellipse cx='50' cy='70' rx='17' ry='19' fill='%23f2ece1'/%3E%3Ccircle cx='39' cy='53' r='5.5' fill='%231a2b45'/%3E%3Ccircle cx='61' cy='53' r='5.5' fill='%231a2b45'/%3E%3Cellipse cx='50' cy='65' rx='6' ry='4.5' fill='%236b4a2f'/%3E%3C/svg%3E">
<noscript><meta http-equiv="refresh" content="3;url=https://www.ynufe.edu.cn/"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<!-- 可复用的渐变：主舞台与四张卡片都从这里取 -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.5" stop-color="#f7cf3c"/>
      <stop offset="1" stop-color="#e0a51f"/>
    </linearGradient>
  </defs>
</svg>

<!-- 主场景。照片加载成功就顶掉内置的 SVG 夜色，加载不到才用 SVG -->
<main class="stage" aria-hidden="true">
  <div class="photo">
    <img class="scene-img" src="https://bu.dusays.com/2026/10/21/6ad859d65b52f.jpg" alt="" data-photo hidden>
    <svg class="scene" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#08152b"/>
          <stop offset="0.4" stop-color="#173561"/>
          <stop offset="0.68" stop-color="#3d6291"/>
          <stop offset="0.86" stop-color="#7d93b4"/>
          <stop offset="1" stop-color="#b9c3d2"/>
        </linearGradient>
        <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9aa9bf"/>
          <stop offset="0.35" stop-color="#4e6b93"/>
          <stop offset="1" stop-color="#1b2f4f"/>
        </linearGradient>
        <radialGradient id="moonGlow">
          <stop offset="0" stop-color="#fff5d6" stop-opacity=".85"/>
          <stop offset="0.45" stop-color="#ffe9b0" stop-opacity=".22"/>
          <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#27456e"/>
          <stop offset="1" stop-color="#152a47"/>
        </linearGradient>
        <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8d3340"/>
          <stop offset="1" stop-color="#4a1a24"/>
        </linearGradient>
      </defs>

      <rect width="300" height="400" fill="url(#sky)"/>
      <circle cx="226" cy="74" r="52" fill="url(#moonGlow)"/>
      <circle cx="226" cy="74" r="19" fill="#fdf4da"/>

      <g fill="#ffffff">
        <circle cx="36" cy="46" r="1.5" opacity=".9"/>
        <circle cx="72" cy="26" r="1.1" opacity=".7"/>
        <circle cx="108" cy="58" r="1.3" opacity=".8"/>
        <circle cx="152" cy="34" r="1.6" opacity=".85"/>
        <circle cx="186" cy="62" r="1" opacity=".6"/>
        <circle cx="258" cy="40" r="1.2" opacity=".75"/>
        <circle cx="282" cy="96" r="1.4" opacity=".8"/>
        <circle cx="20" cy="88" r="1.2" opacity=".65"/>
        <circle cx="128" cy="16" r="1" opacity=".55"/>
        <circle cx="212" cy="120" r="1.1" opacity=".5"/>
      </g>

      <!-- 西倚蛇山：远山剪影 -->
      <path d="M0 232 C22 214 40 226 58 210 C76 194 96 206 118 194 C142 181 160 198 184 186 C210 173 234 190 258 178 C274 170 288 178 300 172 L300 400 L0 400 Z"
            fill="url(#hillFar)"/>

      <!-- 校园红楼（云财屋宇外观以红色为主调） -->
      <g>
        <path d="M42 262 L42 320 L138 320 L138 262 L120 246 L60 246 Z" fill="url(#bldg)"/>
        <path d="M54 246 L90 224 L126 246 Z" fill="#a03c48"/>
        <g fill="#ffd98a" opacity=".78">
          <rect x="54" y="268" width="9" height="12" rx="1.5"/>
          <rect x="72" y="268" width="9" height="12" rx="1.5"/>
          <rect x="90" y="268" width="9" height="12" rx="1.5"/>
          <rect x="108" y="268" width="9" height="12" rx="1.5"/>
          <rect x="63" y="296" width="9" height="12" rx="1.5"/>
          <rect x="99" y="296" width="9" height="12" rx="1.5"/>
        </g>
      </g>
      <g>
        <path d="M166 276 L166 322 L262 322 L262 276 L246 262 L182 262 Z" fill="url(#bldg)" opacity=".92"/>
        <path d="M176 262 L214 242 L252 262 Z" fill="#a03c48" opacity=".92"/>
        <g fill="#ffd98a" opacity=".6">
          <rect x="182" y="282" width="8" height="11" rx="1.5"/>
          <rect x="200" y="282" width="8" height="11" rx="1.5"/>
          <rect x="218" y="282" width="8" height="11" rx="1.5"/>
          <rect x="236" y="282" width="8" height="11" rx="1.5"/>
        </g>
      </g>

      <!-- 宋柏唐梅：岸边一棵树 -->
      <g fill="#12233c">
        <rect x="20" y="286" width="5" height="44"/>
        <ellipse cx="22" cy="276" rx="24" ry="20"/>
        <ellipse cx="10" cy="288" rx="16" ry="13"/>
        <ellipse cx="34" cy="290" rx="15" ry="12"/>
      </g>

      <!-- 东临盘江 -->
      <rect y="326" width="300" height="74" fill="url(#river)"/>
      <g stroke="#dbe6f2" stroke-width="1.6" stroke-linecap="round" opacity=".38">
        <path d="M28 344 h34" />
        <path d="M92 336 h46" />
        <path d="M186 348 h38" />
        <path d="M244 338 h30" />
        <path d="M56 362 h52" />
        <path d="M148 372 h44" />
        <path d="M226 366 h40" />
        <path d="M12 382 h48" />
        <path d="M104 392 h56" />
        <path d="M206 388 h62" />
      </g>
      <ellipse cx="226" cy="352" rx="26" ry="5" fill="#fdf4da" opacity=".22"/>
    </svg>
  </div>

  <!-- 主体是舞台的直接子元素：场景淡出时它留在原地，这就是“从照片里被抠出来”。
       daishu.png 是白底照片抠出的透明图（托管在 7bu 图床），轮廓由它的 alpha 通道提取，
       所以能严丝合缝套住 -->
  <div class="nl" id="nl">
    <picture>
      <source srcset="https://bu.dusays.com/2026/10/21/6ad8568d50aa9.webp" type="image/webp">
      <img class="nl-img" src="https://bu.dusays.com/2026/10/21/6ad856c087750.png" alt="袋鼠">
    </picture>
  </div>
</main>

<!-- 校园里其它几处的贴纸，以拍立得卡片飞入 -->
<div class="cards" aria-hidden="true">
  <div class="card" id="c1" style="--x:12%;--y:19%;--fx:-70vw;--fy:-12vh;--d:0s">
    <img src="https://bu.dusays.com/2026/10/21/6ad856c25843e.jpg" alt="" data-fallback="https://bu.dusays.com/2026/10/21/6ad856c087750.png">
    <span class="card-tag">图书馆前</span>
  </div>
  <div class="card" id="c2" style="--x:88%;--y:15%;--fx:45vw;--fy:-70vh;--d:.12s">
    <img src="https://bu.dusays.com/2026/10/21/6ad856c335998.jpg" alt="" data-fallback="https://bu.dusays.com/2026/10/21/6ad856c087750.png">
    <span class="card-tag">盘龙江边</span>
  </div>
  <div class="card" id="c3" style="--x:89%;--y:78%;--fx:70vw;--fy:45vh;--d:.24s">
    <img src="https://bu.dusays.com/2026/10/21/6ad856c41480c.jpg" alt="" data-fallback="https://bu.dusays.com/2026/10/21/6ad856c087750.png">
    <span class="card-tag">咖啡商学院</span>
  </div>
  <div class="card" id="c4" style="--x:12%;--y:76%;--fx:-68vw;--fy:42vh;--d:.36s">
    <img src="https://bu.dusays.com/2026/10/21/6ad856c4eed9f.jpg" alt="" data-fallback="https://bu.dusays.com/2026/10/21/6ad856c087750.png">
    <span class="card-tag">安宁校区</span>
  </div>
</div>

<!-- 汇聚层：四条轮廓合成一枚铜钱（云财校标里的古钱币） -->
<svg class="morph" id="morph" aria-hidden="true"></svg>

<div class="hero">
  <!-- 校徽环：汇聚的终点落在云财校标上——地球、方足布、1951、中英文校名 -->
  <svg class="emblem" id="emblem" viewBox="0 0 400 400" aria-hidden="true">
    <defs>
      <path id="ringTop" d="M 200 200 m -158 0 a 158 158 0 1 1 316 0"/>
      <path id="ringBot" d="M 200 200 m -170 0 a 170 170 0 0 0 340 0"/>
    </defs>
    <circle cx="200" cy="200" r="194" class="ring-outer"/>
    <circle cx="200" cy="200" r="150" class="ring-inner"/>
    <circle cx="200" cy="200" r="118" class="globe"/>
    <!-- 经纬线：只靠一个填充圆读不出“地球”，得有赤道和经线才成立 -->
    <g class="globe-grid">
      <ellipse cx="200" cy="200" rx="118" ry="46"/>
      <ellipse cx="200" cy="200" rx="46" ry="118"/>
      <ellipse cx="200" cy="200" rx="88" ry="118"/>
    </g>
    <!-- 布币的 d 由 app.js 按 shapes.js 的同一组点生成，保证与补间终点严丝合缝 -->
    <path class="bu" id="buPath" pathLength="100"/>
    <text class="year" x="200" y="336" text-anchor="middle">1951</text>
    <text class="ring-cn"><textPath href="#ringTop" startOffset="50%" text-anchor="middle">云 南 奶 龙 大 学</textPath></text>
    <text class="ring-en"><textPath href="#ringBot" startOffset="50%" text-anchor="middle">YUNNAN NAILONG UNIVERSITY</textPath></text>
  </svg>

  <!-- 小便签广告 -->
  <div class="notes" id="notes">
    <div class="note-col">
      <a class="note note-zs" href="http://bkzsb.ynufe.cloud/" target="_blank" rel="noopener noreferrer" style="--rot:-2.4deg">
        <span class="note-t1">小云彩从这里出发</span>
        <span class="note-t2">云南财经大学本科招生网</span>
        <span class="note-sr">（在新标签页打开）</span>
      </a>
      <a class="note note-kf" href="https://app.xinhuanet.com/news/article.html?articleId=202610174b1def625c8c4d20949282eae1521681" target="_blank" rel="noopener noreferrer" style="--rot:2.4deg">
        <span class="note-t1">会做咖啡 更会经营</span>
        <span class="note-t2">云南咖啡商学院揭牌</span>
        <span class="note-sr">（在新标签页打开）</span>
      </a>
    </div>
    <div class="note-col">
      <button class="note note-tb" type="button" style="--rot:2.6deg" data-open
              data-label="云财兔宝" data-kind="tuzi">
        <span class="note-t1">今年中秋初次亮相</span>
        <span class="note-t2 nb">云财兔宝 · 官方吉祥物</span>
        <span class="note-sr">（点开看看）</span>
      </button>
      <button class="note note-warn" type="button" style="--rot:-2.2deg" data-open
              data-label="猫猫学长" data-kind="cat">
        <span class="note-t1">猫猫学长出没</span>
        <span class="note-t2 nb">猫狗相伴 · 校园日常</span>
        <span class="note-sr">（点开看看）</span>
      </button>
    </div>
  </div>

  <section class="caption" id="caption" role="status" aria-live="polite">
    <h1 class="title">云南奶龙大学</h1>
    <p class="motto">好学笃行 厚德致远</p>
    <p class="status"><span id="statusText">正在跳转至云南财经大学</span><span class="dots" id="dots"><i>.</i><i>.</i><i>.</i></span></p>
    <div class="bar"><span id="bar"></span></div>
    <a class="skip" href="https://www.ynufe.edu.cn/">直接前往 ›</a>
    <p class="copyright">Copyright © 云南奶龙大学筹备处</p>
  </section>
</div>

<!-- 点便签弹出的窗口，内容按 data-* 填 -->
<div class="modal" id="qrModal" hidden>
  <div class="modal-back" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-x" type="button" data-close aria-label="关闭">×</button>
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-body" id="modalBody"></div>
    <p class="modal-hint" id="modalHint"></p>
  </div>
</div>

<div class="wipe" id="wipe" aria-hidden="true"></div>

<script src="shapes.js"></script>
<script src="app.js"></script>
</body>
</html>
